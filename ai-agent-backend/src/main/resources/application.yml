server:
  port: 8081

spring:
  application:
    name: ai-agent-backend

  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-3.1-flash-lite-preview}
          options:
            thinking-budget: 0
            include-thoughts: false
